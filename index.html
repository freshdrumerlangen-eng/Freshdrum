<style>

.section-head{max-width:720px;margin-bottom:40px}

.wave{animation:wave 6s linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-200px)}}

.bub.b2{animation-delay:1.2s}.bub.b3{animation-delay:2.4s}.bub.b4{animation-delay:3.4s}

.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
.spark.s2{animation-delay:1.5s}
@keyframes twinkle{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.1);opacity:1}}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}

.step p{color:var(--muted);margin:0}

/* Prices */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;position:relative}
.price-card.popular{border:2px solid var(--aqua);box-shadow:var(--shadow)}
.tag{position:absolute;top:-13px;left:22px;background:var(--aqua);color:var(--navy);font-size:.75rem;font-weight:800;padding:4px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.price{font-size:2.1rem;font-weight:800;color:var(--navy);margin:4px 0 8px;letter-spacing:-.02em}
.price small{font-size:.9rem;font-weight:600;color:var(--muted);letter-spacing:0}
.price-card p.muted{margin:0}
.extras-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:860px){.extras-row{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:12px 0}
.chips li{background:var(--soft);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:.9rem;font-weight:600}
.referral{background:linear-gradient(135deg,var(--mint),#fff);border-color:#BDEFE7}
.referral h3{display:flex;align-items:center;gap:10px}
.referral h3 svg{color:var(--aqua-d)}
.zones{margin-top:20px}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:700px){.zone-grid{grid-template-columns:1fr}}
.zone-label{font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.zone-label .pill{font-size:.75rem;background:var(--navy);color:#fff;padding:3px 10px;border-radius:999px}
.zone-label .pill.free{background:var(--aqua);color:var(--navy)}
.vat{font-size:.85rem;color:var(--muted);margin-top:16px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}

/* Gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.ba-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.ba figure{margin:0;position:relative;aspect-ratio:1/1;background:var(--soft)}
.ba img{width:100%;height:100%;object-fit:cover}
.ba .lbl{position:absolute;top:10px;left:10px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:rgba(11,37,69,.85);color:#fff}
.ba .lbl.after{background:var(--aqua);color:var(--navy)}
.ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;color:#8A9AAA;font-size:.8rem;font-weight:600;padding:12px}
.ph svg{width:30px;height:30px;margin:0 auto 6px;color:#B5C3D1}
.ph.before-ph{background:repeating-linear-gradient(45deg,#EEF2F6,#EEF2F6 10px,#F6F9FB 10px,#F6F9FB 20px)}
.ph.after-ph{background:linear-gradient(160deg,#F1FCFA,#E2F7F3)}
.ba-card figcaption{padding:14px 18px;font-weight:700;color:var(--navy)}

/* Reviews */
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.review{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;display:flex;flex-direction:column}
.stars{color:var(--gold);font-size:1.15rem;letter-spacing:2px;margin-bottom:10px}
.stars .off{color:#D9E1E8}
.review blockquote{margin:0 0 18px;font-size:1.02rem;flex:1}
.review .who{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy)}
.review .who span.place{font-weight:500;color:var(--muted);font-size:.9rem}
.example{align-self:flex-start;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:#FFF4D6;color:#8A6200;padding:4px 10px;border-radius:999px;margin-bottom:12px}

/* Business */
.biz{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#DCE7F1}
.biz h2{color:#fff}
.biz .kicker{background:rgba(46,196,182,.18);color:#7FE6DB}
.biz .list li{color:#fff}
.biz-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:32px}
.biz-box .big{font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:18px}

/* About */
.about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;align-items:center}
@media (max-width:860px){.about-grid{grid-template-columns:1fr}}
.about-photo{border-radius:30px;overflow:hidden;aspect-ratio:4/5;background:linear-gradient(160deg,var(--aqua),var(--navy));box-shadow:var(--shadow);max-width:420px}
.about-photo img{width:100%;height:100%;object-fit:cover}
.about-photo .initial{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-size:7rem;font-weight:800;letter-spacing:-.04em}
.sign{font-weight:800;color:var(--navy);font-style:italic}

/* FAQ */
.faq{max-width:820px;margin-inline:auto;display:grid;gap:12px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 22px}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--aqua-d);flex:none;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding-bottom:20px;margin:0}

/* Booking */
.book-box{max-width:860px;margin-inline:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:36px;text-align:center;box-shadow:var(--shadow)}
.book-box iframe{width:100%;height:720px;border:0;border-radius:14px;display:block}
.book-box .small{font-size:.85rem;color:var(--muted);margin-top:14px}
.book-box .newtab{display:inline-block;margin-top:12px;font-weight:700;color:var(--aqua-d)}

/* Contact */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.contact-card{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-decoration:none;transition:transform .15s,box-shadow .15s}
a.contact-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.contact-card .ci{width:48px;height:48px;border-radius:14px;background:var(--mint);color:var(--aqua-d);display:grid;place-items:center;flex:none}
.contact-card small{display:block;color:var(--muted);font-weight:600}
.contact-card strong{color:var(--navy);word-break:break-word}

/* Footer */
.site-footer{background:#081A33;color:#AFC0D2;padding:56px 0 28px;font-size:.95rem}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr auto;gap:32px;align-items:start}
@media (max-width:860px){.footer-grid{grid-template-columns:1fr}}
.site-footer .brand{color:#fff;margin-bottom:12px}
.legal-links{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.legal-links a,.legal-links button{background:none;border:0;color:#DCE7F1;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0;font-size:.95rem}
.btn-withdraw{display:inline-flex;align-items:center;gap:8px;background:#FFD166;color:#0B2545;border:2px solid #FFD166;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;text-decoration:none;font-size:1rem;min-height:48px}
.btn-withdraw:hover{background:#FFDD85}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:36px;padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.85rem}
.footer-bottom p{margin:0}

/* Floating WhatsApp */
.fab{position:fixed;right:18px;bottom:18px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.22);text-decoration:none}
.fab svg{width:30px;height:30px}

/* Legal dialog */
dialog.legal{border:0;border-radius:20px;padding:0;width:min(720px,100% - 24px);max-height:86vh;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.legal::backdrop{background:rgba(8,26,51,.6)}
.dlg-head{position:sticky;top:0;background:#fff;display:flex;justify-content:flex-end;padding:12px 12px 0}
.dlg-close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.dlg-body{padding:4px 28px 28px;overflow-wrap:anywhere}
.dlg-body label{display:block;font-weight:700;margin:14px 0 6px;color:var(--navy)}
.dlg-body input,.dlg-body textarea{width:100%;padding:12px 14px;border:1px solid #C9D6E2;border-radius:12px;font:inherit}
.dlg-body textarea{min-height:90px}

/* Reveal on scroll */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  .wave,.bub,.spark{animation:none}
  .bub{opacity:.7}
}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Please enable JavaScript to view this website. · Bitte aktivieren Sie JavaScript.</p></noscript>
<dialog class="legal" id="legalDialog"><div class="dlg-head"><button class="dlg-close" data-close>✕</button></div><div class="dlg-body" id="legalBody"></div></dialog>

<script>
(function(){
  const LANGS = {
    en:{flag:"🇬🇧",code:"EN",name:"English"},
    de:{flag:"🇩🇪",code:"DE",name:"Deutsch"},
    pt:{flag:"🇧🇷",code:"PT",name:"Português"},
    es:{flag:"🇪🇸",code:"ES",name:"Español"}
  };
  const ORDER = ["en","de","pt","es"];
  const B = CONFIG.business;
  const app = document.getElementById("app");
  let lang = pickLang();

  /* ---------- helpers ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function money(n,l){return (l==="de"||l==="es")?n+" €":"€"+n;}
  function wa(msg){return "https://wa.me/"+B.whatsapp+"?text="+encodeURIComponent(msg);}
  function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
  function pickLang(){
    const saved=store("fd_lang");
    if(saved && LANGS[saved]) return saved;
    const nav=(navigator.languages&&navigator.languages[0])||navigator.language||"";
    const two=nav.slice(0,2).toLowerCase();
    return LANGS[two]?two:(LANGS[CONFIG.defaultLanguage]?CONFIG.defaultLanguage:"en");
  }

  /* ---------- icons ---------- */
  const I = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5zm0 2a7.5 7.5 0 1 1-3.9 13.9l-.3-.2-2.4.7.7-2.3-.2-.4A7.5 7.5 0 0 1 12 4.5zm-3 3.6c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.8 4.4 3.8 2.1.8 2.6.7 3 .6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.3-1.6-.8c-.2-.1-.4-.1-.6.1l-.7.9c-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.5.3-.4v-.4l-.7-1.8c-.2-.4-.4-.4-.5-.4h-.2z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>',
    cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12M12 8S10.5 3.5 8 4.5 9 8 12 8zm0 0s1.5-4.5 4-3.5S15 8 12 8z"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
    menu:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    undo:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>'
  };
  const LOGO = '<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0B2545"/><circle cx="20" cy="21" r="10.5" fill="none" stroke="#2EC4B6" stroke-width="3.5"/><path d="M13.5 23.5c2.2 1.6 4.4 1.6 6.5 0s4.3-1.6 6.5 0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="29" cy="10" r="2.4" fill="#2EC4B6"/></svg>';

  const MACHINE = '<svg class="machine" viewBox="0 0 400 500" role="img" aria-label="Clean washing machine illustration">'+
    '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6BEBDD"/><stop offset="1" stop-color="#1A9E92"/></linearGradient>'+
    '<clipPath id="drum"><circle cx="200" cy="296" r="104"/></clipPath></defs>'+
    '<path class="spark" d="M330 70l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#2EC4B6"/>'+
    '<path class="spark s2" d="M62 150l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#7FE6DB"/>'+
    '<rect x="70" y="80" width="260" height="360" rx="28" fill="#F4F8FB"/>'+
    '<path d="M70 108a28 28 0 0 1 28-28h204a28 28 0 0 1 28 28v34H70z" fill="#E3EAF0"/>'+
    '<rect x="92" y="100" width="88" height="26" rx="8" fill="#fff"/>'+
    '<circle cx="244" cy="113" r="5" fill="#2EC4B6"/>'+
    '<circle cx="290" cy="113" r="15" fill="#fff" stroke="#C9D6E2" stroke-width="4"/>'+
    '<circle cx="200" cy="296" r="122" fill="#fff" stroke="#D3DEE8" stroke-width="10"/>'+
    '<circle cx="200" cy="296" r="104" fill="#E8FBF7"/>'+
    '<g clip-path="url(#drum)"><path class="wave" d="M60 310 Q110 288 160 310 T260 310 T360 310 T460 310 T560 310 T660 310 V420 H60Z" fill="url(#wg)" opacity=".92"/>'+
    '<circle class="bub" cx="160" cy="330" r="10" fill="#fff"/><circle class="bub b2" cx="225" cy="340" r="14" fill="#fff"/>'+
    '<circle class="bub b3" cx="195" cy="345" r="7" fill="#fff"/><circle class="bub b4" cx="250" cy="335" r="9" fill="#fff"/></g>'+
    '<path d="M135 250a78 78 0 0 1 52-40" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".85"/>'+
    '<rect x="90" y="430" width="40" height="14" rx="5" fill="#C9D6E2"/><rect x="270" y="430" width="40" height="14" rx="5" fill="#C9D6E2"/>'+
    '</svg>';

  /* ---------- sections ---------- */
  function header(t){
    const ids=["services","how","reviews","business","faq","contact"];
    const links=t.nav.map((n,i)=>'<a href="#'+ids[i]+'">'+esc(n)+'</a>').join("");
    const langs=ORDER.map(l=>'<button type="button" data-lang="'+l+'" aria-pressed="'+(l===lang)+'" aria-label="'+LANGS[l].name+'" title="'+LANGS[l].name+'"><span aria-hidden="true">'+LANGS[l].flag+'</span><span class="lc">'+LANGS[l].code+'</span></button>').join("");
    return '<header class="site-header"><div class="container header-inner">'+
      '<a class="brand" href="#top">'+LOGO+'<span>'+esc(B.name)+'</span></a>'+
      '<nav class="nav" id="nav" aria-label="Menu">'+links+'</nav>'+
      '<div class="langs" role="group" aria-label="Language">'+langs+'</div>'+
      '<a class="btn btn-primary header-book" href="#book">'+esc(t.book_now)+'</a>'+
      '<button type="button" class="menu-btn" data-menu aria-expanded="false" aria-controls="nav" aria-label="'+esc(t.menu)+'">'+I.menu+'</button>'+
      '</div></header>';
  }

  function hero(t){
    const media=CONFIG.images.hero?'<img src="'+esc(CONFIG.images.hero)+'" alt="'+esc(B.name)+'">':MACHINE;
    const low=Math.min.apply(null,CONFIG.prices.filter(p=>p.unit==="machine").map(p=>p.price));
    return '<section class="hero" id="top"><div class="container hero-grid">'+
      '<div class="reveal"><span class="kicker">'+esc(t.hero_kicker)+'</span>'+
      '<h1>'+esc(t.hero_title)+'</h1><p class="tagline">'+esc(t.tagline)+'</p>'+
      '<p class="lead">'+esc(t.hero_text)+'</p>'+
      '<div class="hero-actions"><a class="btn btn-primary" href="#book">'+I.cal+esc(t.book_now)+'</a>'+
      '<a class="btn btn-wa" href="'+wa(t.wa_msg)+'" target="_blank" rel="noopener">'+I.chat+esc(t.hero_wa)+'</a></div>'+
      '<ul class="badges">'+t.badges.map(b=>'<li>'+I.check+esc(b)+'</li>').join("")+'</ul></div>'+
      '<div class="hero-media reveal">'+media+'<div class="price-chip"><small>'+esc(t.from)+'</small><strong>'+money(low,lang)+'</strong> <small style="display:inline">'+esc(t.per_machine)+'</small></div></div>'+
      '</div></section>';
  }

  function problem(t){
    return '<section class="soft" id="problem"><div class="container two-col">'+
      '<div class="reveal"><span class="kicker">'+esc(t.problem_kicker)+'</span><h2>'+esc(t.problem_title)+'</h2>'+
      '<p class="lead">'+esc(t.problem_text)+'</p><ul class="list">'+
      t.problem_points.map(p=>'<li><span class="dot bad">'+I.x+'</span><span>'+esc(p)+'</span></li>').join("")+'</ul></div>'+
      '<div class="solution reveal"><span class="kicker">'+esc(t.solution_kicker)+'</span><h2>'+esc(t.solution_title)+'</h2>'+
      '<p>'+esc(t.solution_text)+'</p><ul class="list">'+
      t.solution_points.map(p=>'<li><span class="dot good">'+I.check+'</span><span>'+esc(p)+'</span></li>').join("")+'</ul></div>'+
      '</div></section>';
  }

  function how(t){
    return '<section id="how"><div class="container"><div class="section-head reveal"><span class="kicker">'+esc(t.how_kicker)+'</span><h2>'+esc(t.how_title)+'</h2></div>'+
      '<div class="steps">'+t.steps.map((s,i)=>'<div class="step reveal"><div class="num">'+(i+1)+'</div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div>').join("")+'</div></div></section>';
  }

  function services(t){
    const unitTxt=u=>u==="machine"?t.per_machine:(u==="clean"?t.per_clean:"");
    const cards=CONFIG.prices.map(p=>{const tx=p[lang]||p.en;
      return '<article class="card price-card reveal'+(p.popular?' popular':'')+'">'+(p.popular?'<span class="tag">'+esc(t.popular)+'</span>':'')+
      '<h3>'+esc(tx[0])+'</h3><p class="price">'+money(p.price,lang)+' <small>'+esc(unitTxt(p.unit))+'</small></p><p class="muted">'+esc(tx[1])+'</p></article>';}).join("");
    const ref=money(CONFIG.referralAmount,lang);
    const z=CONFIG.zones;
    return '<section class="soft" id="services"><div class="container"><div class="section-head reveal"><span class="kicker">'+esc(t.services_kicker)+'</span><h2>'+esc(t.services_title)+'</h2><p class="lead">'+esc(t.services_sub)+'</p></div>'+
      '<div class="cards">'+cards+'</div>'+
      '<div class="extras-row">'+
        '<div class="card reveal"><h3>'+esc(t.extras_title)+'</h3><ul class="chips">'+t.extras_items.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><p class="muted" style="margin:0">'+esc(t.extras_note)+'</p></div>'+
        '<div class="card referral reveal"><h3>'+I.gift+esc(t.referral_title.split("{€}").join(ref))+'</h3><p class="muted" style="margin:0">'+esc(t.referral_text.split("{€}").join(ref))+'</p></div>'+
      '</div>'+
      '<div class="card zones reveal"><h3>'+I.pin.replace('aria-hidden="true"','aria-hidden="true" class="ico" style="vertical-align:-5px;margin-right:6px;color:var(--aqua-d)"')+esc(t.zones_title)+'</h3><div class="zone-grid">'+
        '<div><div class="zone-label"><span class="pill free">'+money(0,lang)+'</span>'+esc(t.zones_free)+'</div><ul class="chips">'+z.free.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>'+
        '<div><div class="zone-label"><span class="pill">+'+money(z.extraFee,lang)+'</span>'+esc(t.zones_extra)+'</div><ul class="chips">'+z.extra.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>'+
      '</div><p class="muted" style="margin:0">'+esc(t.zones_other)+'</p></div>'+
      '<p class="vat">'+esc(CONFIG.vatNote)+'</p>'+
      '<div class="cta-row"><a class="btn btn-primary" href="#book">'+I.cal+esc(t.book_now)+'</a></div>'+
      '</div></section>';
  }

  function gallery(t){
    const slot=(src,cls,label,alt)=>'<figure>'+(src?'<img src="'+esc(src)+'" alt="'+esc(alt)+'" loading="lazy">':'<div class="ph '+cls+'-ph"><div>'+I.photo+esc(t.photo_soon)+'</div></div>')+'<span class="lbl '+cls+'">'+esc(label)+'</span></figure>';
    return '<section id="gallery"><div class="container"><div class="section-head reveal"><span class="kicker">'+esc(t.gallery_kicker)+'</span><h2>'+esc(t.gallery_title)+'</h2><p class="lead">'+esc(t.gallery_sub)+'</p></div>'+
      '<div class="gallery">'+CONFIG.gallery.map(g=>{const cap=(g.caption&&(g.caption[lang]||g.caption.en))||"";
        return '<figure class="ba-card reveal" style="margin:0"><div class="ba">'+slot(g.before,"before",t.before,cap+" – "+t.before)+slot(g.after,"after",t.after,cap+" – "+t.after)+'</div><figcaption>'+esc(cap)+'</figcaption></figure>';}).join("")+'</div></div></section>';
  }

  function reviews(t){
    const stars=n=>{n=Math.max(0,Math.min(5,Number(n)||0));return '<div class="stars" aria-label="'+n+'/5">'+"★".repeat(n)+'<span class="off">'+"★".repeat(5-n)+'</span></div>';};
    return '<section class="soft" id="reviews"><div class="container"><div class="section-head reveal"><span class="kicker">'+esc(t.reviews_kicker)+'</span><h2>'+esc(t.reviews_title)+'</h2></div>'+
      '<div class="reviews">'+CONFIG.reviews.map(r=>'<article class="review reveal">'+(r.example?'<span class="example">'+esc(t.example_review)+'</span>':'')+stars(r.stars)+
        '<blockquote>“'+esc(r.text)+'”</blockquote><div class="who"><span aria-hidden="true">'+((LANGS[r.lang]||{}).flag||"")+'</span><span>'+esc(r.name)+(r.place?' <span class="place">· '+esc(r.place)+'</span>':'')+'</span></div></article>').join("")+
      '</div></div></section>';
  }

  function business(t){
    return '<section class="biz" id="business"><div class="container two-col">'+
      '<div class="reveal"><span class="kicker">'+esc(t.biz_kicker)+'</span><h2>'+esc(t.biz_title)+'</h2><p class="lead" style="color:#C6D5E3">'+esc(t.biz_text)+'</p></div>'+
      '<div class="biz-box reveal"><div class="big">'+esc(t.biz_price)+'</div><ul class="list">'+t.biz_points.map(p=>'<li><span class="dot good">'+I.check+'</span><span>'+esc(p)+'</span></li>').join("")+'</ul>'+
      '<div class="cta-row"><a class="btn btn-primary" href="'+wa(t.biz_msg)+'" target="_blank" rel="noopener">'+I.chat+esc(t.biz_btn)+'</a></div></div>'+
      '</div></section>';
  }

  function about(t){
    const photo=CONFIG.images.about?'<img src="'+esc(CONFIG.images.about)+'" alt="'+esc(B.owner)+'" loading="lazy">':'<div class="initial" aria-hidden="true">G</div>';
    return '<section id="about"><div class="container about-grid">'+
      '<div class="about-photo reveal">'+photo+'</div>'+
      '<div class="reveal"><span class="kicker">'+esc(t.about_kicker)+'</span><h2>'+esc(t.about_title)+'</h2>'+
      t.about_text.map(p=>'<p class="muted" style="font-size:1.05rem">'+esc(p)+'</p>').join("")+'<p class="sign">'+esc(t.about_sign)+'</p></div>'+
      '</div></section>';
  }

  function faq(t){
    return '<section class="soft" id="faq"><div class="container"><div class="section-head center reveal" style="text-align:center"><span class="kicker">'+esc(t.faq_kicker)+'</span><h2>'+esc(t.faq_title)+'</h2></div>'+
      '<div class="faq">'+t.faq.map(f=>'<details class="reveal"><summary>'+esc(f[0])+'</summary><p>'+esc(f[1])+'</p></details>').join("")+'</div></div></section>';
  }

  function book(t){
    let inner;
    if(B.bookingUrl){
      inner='<div id="calSlot"><p class="lead center" style="margin-bottom:22px">'+esc(t.book_sub)+'</p>'+
        '<button type="button" class="btn btn-primary" data-loadcal>'+I.cal+esc(t.book_load)+'</button>'+
        '<p class="small">'+esc(t.book_privacy)+'</p></div>'+
        '<a class="newtab" href="'+esc(B.bookingUrl)+'" target="_blank" rel="noopener">'+esc(t.book_newtab)+' ↗</a>';
    } else {
      inner='<p class="lead center" style="margin-bottom:22px">'+esc(t.book_missing)+'</p><a class="btn btn-wa" href="'+wa(t.wa_msg)+'" target="_blank" rel="noopener">'+I.chat+esc(t.hero_wa)+'</a>';
    }
    return '<section id="book"><div class="container"><div class="section-head center reveal" style="text-align:center"><span class="kicker">'+esc(t.book_kicker)+'</span><h2>'+esc(t.book_title)+'</h2></div>'+
      '<div class="book-box reveal">'+inner+'</div></div></section>';
  }

  function contact(t){
    const card=(href,ico,label,val)=>(href?'<a class="contact-card reveal" href="'+href+'"'+(href.indexOf("http")===0?' target="_blank" rel="noopener"':'')+'>':'<div class="contact-card reveal">')+
      '<span class="ci">'+ico+'</span><span><small>'+esc(label)+'</small><strong>'+esc(val)+'</strong></span>'+(href?'</a>':'</div>');
    return '<section class="soft" id="contact"><div class="container"><div class="section-head reveal"><span class="kicker">'+esc(t.contact_kicker)+'</span><h2>'+esc(t.contact_title)+'</h2><p class="lead">'+esc(t.contact_sub)+'</p></div>'+
      '<div class="contact-grid">'+
        card(wa(t.wa_msg),I.chat,t.c_whatsapp,B.phoneDisplay)+
        card("mailto:"+B.email,I.mail,t.c_email,B.email)+
        card("https://instagram.com/"+encodeURIComponent(B.instagram),I.cam,t.c_instagram,"@"+B.instagram)+
        card("",I.pin,t.c_area,B.areaShort)+
      '</div></div></section>';
  }

  function footer(t){
    const L=CONFIG.legal;
    const link=k=>L[k].url?'<a href="'+esc(L[k].url)+'">'+esc(L[k].label)+'</a>':'<button type="button" data-legal="'+k+'">'+esc(L[k].label)+'</button>';
    const withdraw=L.withdrawUrl?'<a class="btn-withdraw" href="'+esc(L.withdrawUrl)+'">'+I.undo+'Vertrag widerrufen</a>':'<button type="button" class="btn-withdraw" data-withdraw>'+I.undo+'Vertrag widerrufen</button>';
    return '<footer class="site-footer"><div class="container footer-grid">'+
      '<div><a class="brand" href="#top">'+LOGO+'<span>'+esc(B.name)+'</span></a><p>'+esc(t.footer_tag)+'</p></div>'+
      '<div class="legal-links">'+link("impressum")+link("datenschutz")+link("agb")+link("widerruf")+'</div>'+
      '<div>'+withdraw+'</div>'+
      '</div><div class="container footer-bottom"><p>'+esc(CONFIG.vatNote)+'</p><p>© '+new Date().getFullYear()+' '+esc(B.name)+' – Inh. '+esc(B.owner)+'</p></div></footer>'+
      '<a class="fab" href="'+wa(t.wa_msg)+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+I.chat+'</a>';
  }

  /* ---------- render ---------- */
  function render(){
    const t=TEXT[lang];
    const y=window.scrollY;
    document.documentElement.lang=lang;
    document.title=t.meta_title;
    const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute("content",t.meta_desc);
    app.innerHTML=header(t)+'<main>'+hero(t)+problem(t)+how(t)+services(t)+gallery(t)+reviews(t)+business(t)+about(t)+faq(t)+book(t)+contact(t)+'</main>'+footer(t);
    document.querySelector(".dlg-close").textContent="✕ "+t.close;
    window.scrollTo(0,y);
    reveal();
  }

  function reveal(){
    const els=document.querySelectorAll(".reveal");
    if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return;}
    const io=new IntersectionObserver(entries=>entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}}),{rootMargin:"0px 0px -40px 0px",threshold:.08});
    els.forEach(e=>{const r=e.getBoundingClientRect(); if(r.top<window.innerHeight) e.classList.add("in"); else io.observe(e);});
  }

  /* ---------- dialogs ---------- */
  const dlg=document.getElementById("legalDialog");
  const body=document.getElementById("legalBody");
  function openDlg(html){
    body.innerHTML=html;
    if(typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
  }
  function closeDlg(){ if(typeof dlg.close==="function") dlg.close(); else dlg.removeAttribute("open"); }
  function withdrawForm(){
    return '<h2>Vertrag widerrufen</h2><p>Hiermit widerrufe ich den von mir abgeschlossenen Vertrag über die folgende Dienstleistung.</p>'+
      '<form id="wForm"><label for="wName">Name</label><input id="wName" required autocomplete="name">'+
      '<label for="wMail">E-Mail-Adresse</label><input id="wMail" type="email" required autocomplete="email">'+
      '<label for="wInfo">Gebuchte Leistung / Termin / Buchungsnummer</label><input id="wInfo" required>'+
      '<label for="wMsg">Nachricht (optional)</label><textarea id="wMsg"></textarea>'+
      '<div class="cta-row"><button class="btn btn-dark" type="submit">Widerruf bestätigen</button></div>'+
      '<p class="muted" style="font-size:.85rem;margin-top:12px">Ihr E-Mail-Programm öffnet sich mit einer fertigen Nachricht an '+esc(B.email)+'. Sie erhalten eine Eingangsbestätigung per E-Mail.</p></form>';
  }

  /* ---------- events ---------- */
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-lang],[data-menu],[data-legal],[data-withdraw],[data-loadcal],[data-close],.nav a");
    if(!el) return;
    if(el.dataset.lang){ lang=el.dataset.lang; store("fd_lang",lang); render(); return; }
    if(el.hasAttribute("data-menu")){ const n=document.getElementById("nav"); const open=n.classList.toggle("open"); el.setAttribute("aria-expanded",open); return; }
    if(el.matches(".nav a")){ document.getElementById("nav").classList.remove("open"); return; }
    if(el.dataset.legal){ openDlg(CONFIG.legal[el.dataset.legal].text); return; }
    if(el.hasAttribute("data-withdraw")){ openDlg(withdrawForm()); return; }
    if(el.hasAttribute("data-close")){ closeDlg(); return; }
    if(el.hasAttribute("data-loadcal")){
      const slot=document.getElementById("calSlot");
      slot.innerHTML='<iframe src="'+esc(B.bookingUrl)+'" title="Booking" loading="lazy" allow="payment"></iframe>';
      return;
    }
  });
  dlg.addEventListener("click",e=>{ if(e.target===dlg) closeDlg(); });
  document.addEventListener("submit",e=>{
    if(e.target.id!=="wForm") return;
    e.preventDefault();
    const v=id=>document.getElementById(id).value;
    const text="Widerruf\n\nHiermit widerrufe ich den von mir abgeschlossenen Vertrag.\n\nName: "+v("wName")+"\nE-Mail: "+v("wMail")+"\nLeistung/Termin/Buchung: "+v("wInfo")+"\nNachricht: "+v("wMsg")+"\nDatum: "+new Date().toLocaleString("de-DE");
    window.location.href="mailto:"+B.email+"?subject="+encodeURIComponent("Widerruf – "+v("wName"))+"&body="+encodeURIComponent(text);
  });

  /* ---------- structured data for Google ---------- */
  try{
    const ld={"@context":"https://schema.org","@type":"LocalBusiness","name":B.name,"description":TEXT.en.meta_desc,
      "telephone":B.phoneDisplay,"email":B.email,"founder":{"@type":"Person","name":B.owner},
      "areaServed":CONFIG.zones.free.concat(CONFIG.zones.extra),"priceRange":"€€","knowsLanguage":["en","de","pt","es"],
      "address":{"@type":"PostalAddress","addressLocality":"Erlangen","addressRegion":"Bayern","addressCountry":"DE"},"url":location.href.split("#")[0]};
    const s=document.createElement("script"); s.type="application/ld+json"; s.textContent=JSON.stringify(ld); document.head.appendChild(s);
  }catch(e){}

  render();
})();
</script>
</body>
</html>
